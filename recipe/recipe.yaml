schema_version: 1

context:
  name: runner
  version: "2.0.5_20260820"

package:
  name: "runner"
  version: ${{ version }}

# Obtain the checksum using
# curl -sL https://gitlab.com/runner-suite/runner2/-/archive/{{ version }}/runner2-{{ version }}.tar.gz | sha256sum
source:
  url: https://gitlab.com/runner-suite/runner2/-/archive/${{ version }}/runner2-${{ version }}.tar.gz
  sha256: 5ac9badfff4fabc4388b8448d3c06ac1f2f9f4767551ab7f9bb5b94d6fb85f2c

build:
  number: 0
  string: "${{ runner_variant }}_h${{ hash }}_${{ build_number }}"
  skip: not (linux or osx) or (is_intel and osx)

requirements:
  build:
    - cmake
    - make
    - m4
    - ${{ stdlib('c') }}
    - if: is_intel
      then:
        - ifx_linux-64
        - dpcpp_linux-64
      else:
        - ${{ compiler('c') }}
        - ${{ compiler('fortran') }}

  host:
    - if: is_intel
      then:
        - mkl
        - mkl-include
        - mkl-devel
        - mkl-static
        - intel-cmplr-lib-rt
      else:
        - libblas
        - liblapack
        - fftw
    # OpenMP libraries for GNU differ between Linux and OSX.
    - if: not is_intel and linux
      then:
        - libgomp
    - if: not is_intel and osx
      then:
        - llvm-openmp
    # MPI libraries differ between GNU and Intel toolchain.
    - if: is_intel and with_mpi
      then:
        - openmpi-mpiicx
    - if: not is_intel and with_mpi
      then:
        - openmpi

  run:
    - if: is_intel
      then:
        - mkl
        - intel-fortran-rt
        - intel-cmplr-lib-rt
      else:
        - libblas
        - liblapack
        - fftw
    # OpenMP libraries for GNU differ between Linux and OSX.
    - if: not is_intel and linux
      then:
        - libgomp
    - if: not is_intel and osx
      then:
        - llvm-openmp
    # MPI libraries differ between GNU and Intel toolchain.
    - if: is_intel and with_mpi
      then:
        - openmpi-mpiicx
    - if: not is_intel and with_mpi
      then:
        - openmpi

  # ``dpcpp_linux-64`` is only needed at build time to provide ``icx``.  Its
  # run export drags in the whole SYCL/OpenCL stack (``dpcpp-cpp-rt`` ->
  # ``intel-cmplr-lib-ur`` -> ``umf`` -> ``libhwloc >=2.13``), which is both
  # unused here and unsolvable: since 2026.1.1 ``intel-fortran-rt`` depends on
  # ``mpich``, which requires ``libhwloc <2.12.3``.  RuNNer links only against
  # libimf/libintlc/libsvml (intel-cmplr-lib-rt), libifcoremt (intel-fortran-rt)
  # and MKL, so the SYCL runtime can be dropped safely.
  ignore_run_exports:
    by_name:
      - dpcpp-cpp-rt

tests:
  - script:
      - if: with_mpi
        then:
          - RuNNer_mpi.x --version
        else:
          - RuNNer.x --version
      - if: is_intel and not with_mpi
        then:
          - ldd $(which RuNNer.x) | grep -i mkl
      - if: is_intel and with_mpi
        then:
          - ldd $(which RuNNer_mpi.x) | grep -i mkl

about:
  homepage: https://www.theochem2.ruhr-uni-bochum.de/tc/software/runner.html.en
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE
  summary: 'RuNNer - a Neural Network code for high-dimensional systems'
  description: |
    RuNNer is a software framework for the development of Behler-Parrinello
    high-dimensional neural network potentials (HDNNPs), actively developed
    at Ruhr Universität Bochum, Germany.

    Three build variants are provided under the single package name ``runner``:

    gnu_omp
      GCC/gfortran, OpenBLAS, serial only.  Linux and macOS.

    gnu_mpi_omp
      GCC/gfortran, OpenBLAS, OpenMPI parallel build.  Linux and macOS.

    intel
      Intel ifx, MKL, serial only.  Linux x86-64 only.

    Select a specific variant with a build-string glob, e.g.::

      conda install "runner=*=gnu_omp_*"   # GNU serial
      conda install "runner=*=gnu_mpi_omp_*"   # GNU parallel
      conda install "runner=*=intel_*"   # Intel serial

    A parallel Intel variant is not provided.
  documentation: https://runner-suite.gitlab.io/runner2
  repository: https://gitlab.com/runner-suite/runner2

extra:
  recipe-maintainers:
    - Theochem2RUB
    - gunnar1987
    - mirajkovic
    - lxknll
    - M0M097
    - jan-janssen
